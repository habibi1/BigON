name: CI

# §9·05 lists CI wiring as outstanding work. This is the first half of it: every
# push compiles the app and runs the unit tests and the Konsist rules, so the
# guardrails §7 describes are enforced by something other than remembering to
# run them. Lint, R8, baseline profiles and screenshot tests are deliberately
# not here yet — see the note at the bottom of this file.

on:
  push:
    branches: [develop, 'claude/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins toolchainVersion=25. Providing
      # 25 here means Gradle matches it locally instead of trying to fetch a
      # toolchain from api.foojay.io mid-build.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk in sinema/build.gradle.kts. Runner images lag the newest
      # platform, so it is provisioned here rather than assumed — but this step
      # provisions and reports, it does not gatekeep. Whether the build can
      # actually proceed is a question for the build, which gives a far better
      # error than a bare sdkmanager exit code. The first run failed exactly
      # this way: `Failed to find package 'platforms;android-37'` told us
      # nothing about which platforms *do* exist, so now the log says.
      - name: Provision the compile SDK platform
        continue-on-error: true
        run: |
          set -u
          COMPILE_SDK=37
          if [ -d "${ANDROID_HOME}/platforms/android-${COMPILE_SDK}" ]; then
            echo "platforms;android-${COMPILE_SDK} already present on the image"
            exit 0
          fi
          # Stable first, then the preview channels — a compileSdk is allowed
          # to lead the stable channel by a release.
          sdkmanager "platforms;android-${COMPILE_SDK}" \
            || sdkmanager --channel=3 "platforms;android-${COMPILE_SDK}" \
            || echo "::warning::platforms;android-${COMPILE_SDK} not installable — see the inventory below"
          echo "--- installed platforms ---"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || echo "(none)"
          echo "--- platforms offered by sdkmanager ---"
          sdkmanager --list 2>/dev/null \
            | grep -oE "platforms;android-[0-9A-Za-z.-]+" | sort -u | tail -25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The build reads TMDB credentials from local.properties and only warns
      # when they are absent, so CI compiles either way. Supplying them from
      # repository secrets is what makes the uploaded APK actually usable
      # against the live API. Passed through env rather than interpolated into
      # the script, so a credential can never be read as shell syntax.
      - name: Write local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          {
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN}"
          } > local.properties

      - name: Assemble debug
        run: ./gradlew assembleDebug

      # `test` rather than `testDebugUnitTest`: the six framework-free JVM
      # modules have no debug variant, and skipping them would quietly drop the
      # repository, mapper and interceptor suites. Konsist's architecture rules
      # ride along here — they are ordinary JUnit tests in :sinema.
      - name: Unit tests and Konsist rules
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      # The point of keeping this on a green run: this container cannot run an
      # emulator (no /dev/kvm), so a real device is the only way to see a
      # layout change. The APK is how it gets to one.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sinema-debug-apk
          path: sinema/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

# Deliberately not here yet:
#
#  - `lint`. It has never been run in this project, so switching it on in the
#    same change that introduces CI would make the first red build a report on
#    pre-existing debt rather than on the commit that triggered it. Worth
#    adding as its own change, once someone has read the baseline.
#  - An instrumented / emulator job. The only androidTest source is the
#    template ExampleInstrumentedTest, so a job that boots an emulator would
#    spend several minutes asserting the package name. It becomes worth having
#    the moment there is something real to run on it.
#  - Screenshot tests per window size class (§9·05). These want a JVM-based
#    renderer such as Roborazzi or Paparazzi rather than an emulator, which is
#    its own piece of work — and the one that would let a layout change be
#    verified without a device at all.
