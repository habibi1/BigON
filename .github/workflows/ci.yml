name: CI

# §9·05 lists CI wiring as outstanding work. This is the first half of it: every
# push compiles the app and runs the unit tests and the Konsist rules, so the
# guardrails §7 describes are enforced by something other than remembering to
# run them. Lint, R8, baseline profiles and screenshot tests are deliberately
# not here yet — see the note at the bottom of this file.

on:
  push:
    branches: [develop, 'claude/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins toolchainVersion=25. Providing
      # 25 here means Gradle matches it locally instead of trying to fetch a
      # toolchain from api.foojay.io mid-build.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk in sinema/build.gradle.kts. Runner images lag the newest
      # platform, so it is provisioned here rather than assumed — but this step
      # provisions and reports, it does not gatekeep. Whether the build can
      # actually proceed is a question for the build, which gives a far better
      # error than a bare sdkmanager exit code. The first run failed exactly
      # this way: `Failed to find package 'platforms;android-37'` told us
      # nothing about which platforms *do* exist, so now the log says.
      - name: Provision the compile SDK platform
        continue-on-error: true
        run: |
          set -u
          COMPILE_SDK=37
          if [ -d "${ANDROID_HOME}/platforms/android-${COMPILE_SDK}" ]; then
            echo "platforms;android-${COMPILE_SDK} already present on the image"
            exit 0
          fi
          # Stable first, then the preview channels — a compileSdk is allowed
          # to lead the stable channel by a release.
          sdkmanager "platforms;android-${COMPILE_SDK}" \
            || sdkmanager --channel=3 "platforms;android-${COMPILE_SDK}" \
            || echo "::warning::platforms;android-${COMPILE_SDK} not installable — see the inventory below"
          echo "--- installed platforms ---"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || echo "(none)"
          echo "--- platforms offered by sdkmanager ---"
          sdkmanager --list 2>/dev/null \
            | grep -oE "platforms;android-[0-9A-Za-z.-]+" | sort -u | tail -25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The build reads TMDB credentials from local.properties and only warns
      # when they are absent, so CI compiles either way. Supplying them from
      # repository secrets is what makes the uploaded APK actually usable
      # against the live API. Passed through env rather than interpolated into
      # the script, so a credential can never be read as shell syntax.
      - name: Write local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          {
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN}"
          } > local.properties

      - name: Assemble debug
        run: ./gradlew assembleDebug

      # `test` rather than `testDebugUnitTest`: the six framework-free JVM
      # modules have no debug variant, and skipping them would quietly drop the
      # repository, mapper and interceptor suites. Konsist's architecture rules
      # ride along here — they are ordinary JUnit tests in :sinema.
      - name: Unit tests and Konsist rules
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      # The point of keeping this on a green run: this container cannot run an
      # emulator (no /dev/kvm), so a real device is the only way to see a
      # layout change. The APK is how it gets to one.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sinema-debug-apk
          path: sinema/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  # Screenshots of the app actually running. Neither the agent container nor
  # any local sandbox here has /dev/kvm, so this runner is the only place a
  # Sinema build can be looked at rather than reasoned about — which is exactly
  # how the stale store-listing captures went unnoticed for three days.
  #
  # Separate job because it is slow and because a red emulator must not be
  # mistaken for a red build; `needs: build` keeps it from booting a device to
  # exercise code that does not compile.
  screenshots:
    name: Emulator screenshots
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    # Widened from the workflow default so the captures can be committed back —
    # see the final step for why an artifact alone is not enough here.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          {
            echo "TMDB_API_KEY=${TMDB_API_KEY}"
            echo "TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN}"
          } > local.properties
          if [ -z "${TMDB_API_KEY}" ] && [ -z "${TMDB_READ_ACCESS_TOKEN}" ]; then
            echo "::warning::No TMDB credentials — every request returns 401, so \
          the captures will show empty and error states. The filter bar still \
          renders, but there will be no posters and no genre chips. Set \
          TMDB_API_KEY or TMDB_READ_ACCESS_TOKEN as a repository secret."
          fi

      # Runner images ship KVM but do not grant it to the job user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 rather than the compile SDK: minSdk is 26, the screens under
      # inspection are pure Compose, and a system image lands faster than a
      # bleeding-edge one.
      - name: Boot an emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew installDebug
            ./scripts/capture-screenshots.sh screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinema-screenshots
          path: screenshots/*.png
          retention-days: 14
          if-no-files-found: warn

      # An artifact expires in 14 days and lives behind a blob host that not
      # every consumer of this repository can reach. Committing the captures
      # keeps them reviewable in the diff — the screen that changed shows up
      # beside the code that changed it, which is the one place a stale capture
      # cannot hide. `[skip ci]` stops this from triggering itself, and the
      # frozen status bar (see the capture script) means an unchanged screen
      # produces an identical file and therefore no commit at all.
      - name: Commit the captures back to the branch
        if: github.event_name == 'push' && success()
        run: |
          set -euo pipefail
          mkdir -p docs/screenshots/emulator
          cp screenshots/*.png docs/screenshots/emulator/ 2>/dev/null || {
            echo "nothing captured — leaving the committed set alone"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then compare the index. `git diff` alone reports no
          # change for a directory whose files are all untracked, which is
          # exactly the state of the very first run — it would report "nothing
          # to do" precisely when there was everything to do.
          git add docs/screenshots/emulator
          if git diff --cached --quiet -- docs/screenshots/emulator; then
            echo "captures are byte-identical to the committed set"; exit 0
          fi
          git commit -m "docs: refresh emulator captures for ${GITHUB_SHA::7} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Deliberately not here yet:
#
#  - `lint`. It has never been run in this project, so switching it on in the
#    same change that introduces CI would make the first red build a report on
#    pre-existing debt rather than on the commit that triggered it. Worth
#    adding as its own change, once someone has read the baseline.
#  - Instrumented tests. The only androidTest source is the template
#    ExampleInstrumentedTest. The emulator above earns its minutes by capturing
#    screens, not by asserting a package name; real instrumented tests would
#    ride the same job once they exist.
#  - Screenshot *tests* per window size class (§9·05). The job above captures,
#    it does not compare — nothing fails when a layout regresses. Turning these
#    into a regression gate wants a JVM renderer such as Roborazzi or Paparazzi,
#    which is both faster than an emulator and able to fail a build on a diff.
