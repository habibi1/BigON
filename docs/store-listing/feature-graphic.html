<!doctype html>
<!--
  Play Store feature graphic, 1024x500. Rendered with headless Chrome.

  Deliberately typographic: no film posters appear here. Poster artwork is
  studio-owned and licensed to TMDB for use *inside* the app, which is not the
  same as licence to use it as store marketing.

  Google crops this graphic differently across placements, so nothing that
  matters sits within 72px of an edge.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: system; src: local("Roboto"), local("Helvetica Neue"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #0D1115;
    font-family: "Roboto", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .canvas {
    position: relative;
    width: 1024px; height: 500px;
    background:
      radial-gradient(circle at 26% 46%, rgba(255,182,72,0.20) 0%, rgba(255,182,72,0.07) 38%, rgba(255,182,72,0) 68%),
      linear-gradient(135deg, #1E252C 0%, #151B21 55%, #0D1115 100%);
    display: flex;
    align-items: center;
    gap: 52px;
    padding: 0 72px;
  }
  /* Faint film-sprocket rail, echoing the icon, bled off the right edge. */
  .rail {
    position: absolute; top: 0; right: 0; width: 320px; height: 100%;
    background: linear-gradient(90deg, rgba(255,182,72,0) 0%, rgba(255,182,72,0.05) 100%);
  }
  .rail span {
    position: absolute; right: 40px; width: 26px; height: 44px;
    border-radius: 6px; background: rgba(255,182,72,0.10);
  }
  .mark { flex: none; filter: drop-shadow(0 8px 28px rgba(0,0,0,0.5)); }
  .copy { position: relative; z-index: 2; }
  h1 {
    font-size: 92px; font-weight: 700; letter-spacing: -0.035em;
    color: #F2F4F6; line-height: 1;
  }
  .rule { width: 64px; height: 4px; background: #FFB648; border-radius: 2px; margin: 22px 0; }
  p {
    font-size: 30px; line-height: 1.35; font-weight: 400;
    color: #A9B4BE; letter-spacing: -0.005em; max-width: 520px;
  }
  p b { color: #FFC978; font-weight: 600; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="rail">
      <span style="top: 58px"></span>
      <span style="top: 158px"></span>
      <span style="top: 258px"></span>
      <span style="top: 358px"></span>
    </div>

    <svg class="mark" width="196" height="196" viewBox="18 18 72 72">
      <defs>
        <linearGradient id="f" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="108" y2="108">
          <stop offset="0" stop-color="#232B33"/><stop offset="1" stop-color="#12171C"/>
        </linearGradient>
      </defs>
      <rect x="18" y="18" width="72" height="72" rx="16" fill="url(#f)"/>
      <path fill="#FFB648" fill-rule="evenodd"
        d="M35,36H73A7,7 0 0 1 80,43V65A7,7 0 0 1 73,72H35A7,7 0 0 1 28,65V43A7,7 0 0 1 35,36ZM43,42A3,3 0 0 0 40,45V63A3,3 0 0 0 43,66H65A3,3 0 0 0 68,63V45A3,3 0 0 0 65,42ZM33.05,40A1.3,1.3 0 0 0 31.75,41.3V42.7A1.3,1.3 0 0 0 33.05,44H34.95A1.3,1.3 0 0 0 36.25,42.7V41.3A1.3,1.3 0 0 0 34.95,40ZM33.05,52A1.3,1.3 0 0 0 31.75,53.3V54.7A1.3,1.3 0 0 0 33.05,56H34.95A1.3,1.3 0 0 0 36.25,54.7V53.3A1.3,1.3 0 0 0 34.95,52ZM33.05,64A1.3,1.3 0 0 0 31.75,65.3V66.7A1.3,1.3 0 0 0 33.05,68H34.95A1.3,1.3 0 0 0 36.25,66.7V65.3A1.3,1.3 0 0 0 34.95,64ZM73.05,40A1.3,1.3 0 0 0 71.75,41.3V42.7A1.3,1.3 0 0 0 73.05,44H74.95A1.3,1.3 0 0 0 76.25,42.7V41.3A1.3,1.3 0 0 0 74.95,40ZM73.05,52A1.3,1.3 0 0 0 71.75,53.3V54.7A1.3,1.3 0 0 0 73.05,56H74.95A1.3,1.3 0 0 0 76.25,54.7V53.3A1.3,1.3 0 0 0 74.95,52ZM73.05,64A1.3,1.3 0 0 0 71.75,65.3V66.7A1.3,1.3 0 0 0 73.05,68H74.95A1.3,1.3 0 0 0 76.25,66.7V65.3A1.3,1.3 0 0 0 74.95,64Z"/>
      <path fill="#FFB648" stroke="#FFB648" stroke-width="3.5"
            stroke-linejoin="round" stroke-linecap="round" d="M49,46.5L49,61.5L62,54Z"/>
    </svg>

    <div class="copy">
      <h1>Sinema</h1>
      <div class="rule"></div>
      <p>Browse, search and save films — <b>and keep browsing offline</b>.</p>
    </div>
  </div>
</body>
</html>
